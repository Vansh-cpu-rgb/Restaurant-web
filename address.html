<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8"/>

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0"/>

  <title>Delivery Address</title>

  <link rel="stylesheet"
    href="style.css"/>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body class="address-page">
  
  <!-- LOADER -->

<div class="loader">

<div class="loader-content">

<div class="loader-logo">
🍔
</div>

<h2>
Foodie Express
</h2>

<p>
Preparing your delicious experience...
</p>

<div class="loader-spinner">
</div>

</div>

</div>

  <!-- TOP -->

  <div class="address-top">

    <button onclick="goBack()" class="back-btn">

      <i class="fa-solid fa-arrow-left"></i>

    </button>

    <div>

      <h2>Delivery Address</h2>

      <p>Where should we deliver your food? 😋</p>

    </div>

  </div>

  <!-- LOCATION CARD -->

  <div class="location-card">

    <div class="location-left">

      <i class="fa-solid fa-location-crosshairs"></i>

      <div>

        <h3>Use Current Location</h3>

        <p id="locationText">

          Tap to fetch live location

        </p>

      </div>

    </div>

<button id="detectBtn" onclick="getLocation()">
    Detect
</button>

  </div>

  <!-- ADDRESS FORM -->

  <div class="address-form">

    <h2>Enter Address Details</h2>

    <input
      type="text"
      id="fullName"
      placeholder="Full Name"
    />

    <input
      type="number"
      id="phone"
      placeholder="Phone Number"
    />

    <textarea
      id="address"
      placeholder="House No, Area, Street..."
    ></textarea>

    <input
      type="text"
      id="landmark"
      placeholder="Landmark"
    />

    <input
      type="text"
      id="city"
      placeholder="City"
      value="Lucknow"
    />
     <input
      type="text"
      id="pincode"
      placeholder="PIN Code"
      readonly
      />

  </div>

  <!-- SAVE ADDRESS -->

  <div class="save-address-box">

    <button onclick="saveAddress()">

      Save & Continue

    </button>

  </div>

  <script src="address.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>
</body>
</html>
