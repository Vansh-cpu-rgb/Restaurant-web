<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

body{
  .top-bar{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:30px;
}

.top-bar i{
  color:#fff;
  font-size:24px;
  cursor:pointer;
}

.top-bar h2{
  color:#ff7a00;
  margin:0;
}
  font-family: Arial, sans-serif;
  background:#000;
  color:white;
  margin:0;
  padding:20px;
}

h2{
  text-align:center;
  color:#ff7a00;
  margin-bottom:25px;
}

.order-card{
  background:#111;
  border:1px solid #222;
  padding:18px;
  border-radius:20px;
  margin-bottom:18px;
  box-shadow:0 0 15px rgba(255,122,0,.15);
}

.status{
  color:#ff7a00;
  font-weight:bold;
}
.view-btn{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#ff7a00;
  color:white;
  font-weight:bold;
}
.order-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.popup-content{
  width:90%;
  max-height:80vh;
  overflow:auto;
  background:#111;
  color:white;
  border-radius:20px;
  padding:20px;
  border:1px solid #ff7a00;
}

#reorderBtn,
#closePopup{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
}

#reorderBtn{
  background:#ff7a00;
  color:white;
}

#closePopup{
  background:#222;
  color:white;
}
.popup-item{
  display:flex;
  align-items:center;
  gap:15px;
  margin:15px 0;
  padding:12px;
  background:#111;
  border-radius:12px;
}

.popup-item-img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}

.popup-item-info h4{
  margin:0;
  color:white;
}

.popup-item-info p{
  margin:4px 0;
  color:#ccc;
}
.empty-orders{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;

  background:#111;
  border:1px solid rgba(255,140,0,0.3);

  border-radius:20px;
  padding:50px 25px;
  margin-top:40px;

  box-shadow:0 0 25px rgba(255,140,0,0.15);
}

.empty-orders h2{
  color:#ff7b00;
  font-size:32px;
  margin-bottom:15px;
}

.empty-orders p{
  color:#bbb;
  font-size:16px;
  margin-bottom:25px;
  line-height:1.6;
}

.empty-orders button{
  background:#ff7b00;
  color:white;

  border:none;
  border-radius:12px;

  padding:14px 28px;

  font-size:16px;
  font-weight:600;

  cursor:pointer;

  transition:0.3s;
}

.empty-orders button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(255,123,0,0.4);
}
.page-loader{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:99999;
    transition:0.5s;
}

.loader-logo{
    color:#ff7a00;
    font-size:32px;
    font-weight:bold;
    margin-bottom:10px;
}

.loader-text{
    color:white;
    margin-bottom:20px;
}

.loader-spinner{
    width:50px;
    height:50px;
    border:4px solid #333;
    border-top:4px solid #ff7a00;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

  </style>

</head>

<body>

  <div class="page-loader">
    <div class="loader-logo">FoodExpress</div>
    <div class="loader-text">
        Preparing delicious experience...
    </div>
    <div class="loader-spinner"></div>
</div>
<div class="top-bar">

  <i class="fa-solid fa-arrow-left"
     onclick="window.location.href='profile.html'">
  </i>

  <h2>My Orders</h2>

</div>

<div id="ordersContainer"></div>
<div id="orderPopup" class="order-popup">

  <div class="popup-content">

    <h2>🍔 Order Details</h2>

    <div id="popupDetails"></div>

    <button id="reorderBtn">
      Reorder 🔄
    </button>

    <button id="closePopup">
      Close ❌
    </button>

  </div>

</div>

<script type="module" src="myorders.js"></script>

</body>
</html>
