<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodExpress Categories</title>

<link rel="stylesheet" href="categories.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- LOADER -->

<div class="page-loader">

<div class="loader-spinner"></div>

<p>Loading Categories...</p>

</div>

<!-- HEADER -->

<header class="category-header">

<div class="logo">

🍔 FoodExpress

</div>

<div class="header-icons">

<i class="fa-solid fa-magnifying-glass"></i>

<i class="fa-solid fa-cart-shopping"
onclick="window.location.href='cart.html'"></i>

</div>

</header>

<!-- SEARCH -->

<section class="search-section">

<div class="search-box">

<i class="fa-solid fa-search"></i>

<input
type="text"
id="searchInput"
placeholder="Search categories...">

</div>

</section>

<!-- PAGE TITLE -->

<section class="title-section">

<h2>Browse Categories</h2>

<p>Choose your favourite food</p>

</section>

<!-- CATEGORIES GRID -->

<section
class="categories-grid"
id="categoriesGrid">

<!-- Firebase Categories Render Here -->

</section>

<!-- FLOATING CART -->

<div
class="floating-cart"
id="floatingCart"
style="display:none;">

<div>

<h3 id="cartCount">
0 Items
</h3>

<p id="cartTotal">
₹0
</p>

</div>

<button
onclick="window.location.href='cart.html'">

View Cart

</button>

</div>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

<div class="nav-item"
onclick="window.location.href='index.html'">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</div>

<div class="nav-item active-nav">

<i class="fa-solid fa-layer-group"></i>

<span>Categories</span>

</div>

<div class="nav-item"
onclick="window.location.href='orders.html'">

<i class="fa-solid fa-bag-shopping"></i>

<span>Orders</span>

</div>

<div class="nav-item"
onclick="window.location.href='profile.html'">

<i class="fa-solid fa-user"></i>

<span>Profile</span>

</div>

</nav>

<script type="module" src="categories.js"></script>

</body>

</html>
